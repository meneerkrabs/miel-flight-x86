name: Native flight Windows suite

on:
  workflow_dispatch:
    inputs:
      input_keeper:
        description: 'Background SendKeys input keeper (space every 300ms)'
        type: boolean
        default: false
      ddraw_renderer:
        description: 'cnc-ddraw renderer (gdi = pure software, no D3D9/WARP)'
        type: choice
        default: gdi
        options: [gdi, auto, opengl, direct3d9]
      strip_at_language:
        description: 'Rewrite packages.ini without the unresolved @language line'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
      - name: Download ISO
        run: |
          mkdir -p /tmp/isos
          gh release download flight-iso-v1 --repo meneerkrabs/miel-flight-x86 \
            --pattern "Mielvliegt.iso.gpg" --dir /tmp/isos
          echo "$ISO_GPG_PASSPHRASE" | gpg --batch --yes --decrypt \
            --passphrase-fd 0 --output /tmp/isos/Mielvliegt.iso /tmp/isos/Mielvliegt.iso.gpg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISO_GPG_PASSPHRASE: ${{ secrets.ISO_GPG_PASSPHRASE }}
      - name: Extract game files
        run: |
          sudo apt-get install -y p7zip-full unshield
          mkdir -p /tmp/game-files
          7z x -y -o/tmp/game-files/installer /tmp/isos/Mielvliegt.iso >/dev/null
          cd /tmp/game-files && mkdir system && cd system
          unshield -g "System Files" x /tmp/game-files/installer/data1.cab
          7z e -y -o/tmp/game-files/system/System_Files /tmp/isos/Mielvliegt.iso data.up map.up sounds.up Miel.ini
          # Package everything
          cd /tmp/game-files/system/System_Files
          tar czf /tmp/game-files.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: game-files
          retention-days: 1
          path: /tmp/game-files.tar.gz

  windows:
    needs: extract
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install 7zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Install MSYS2 32-bit MinGW
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-i686-gcc mingw-w64-i686-make"
          echo "C:\msys64\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build observer tools
        shell: bash
        run: |
          set -ex
          export PATH="/c/msys64/mingw32/bin:$PATH"
          cd tools/miel_vliegt
          python3 native_scene_navigator.py emit-header hangover/native_scenes.generated.h 2>/dev/null || true
          PRODUCER_SHA=$(PYTHONPATH=. python3 -c "from native_dispatch_hook_contract import compute_producer_build_sha; print(compute_producer_build_sha())" 2>/dev/null || echo "placeholder")
          EXE_HASH="a84550b46612dc326177a67a84d6fd1e35aae3dc74361254611d1b03eda559a2"
          mkdir -p /opt/miel
          CC=$(which i686-w64-mingw32-gcc 2>/dev/null || which gcc)
          $CC -m32 -std=c11 -Os -s -Ihangover \
            -DMIEL_EXPECTED_EXE_SHA256=\"$EXE_HASH\" \
            hangover/native_observer_launcher.c -o /opt/miel/native-observer-launcher.exe -lole32
          $CC -m32 -std=c11 -Os -s -shared -Ihangover \
            -DMVDS_PRODUCER_BUILD_SHA256=\"${PRODUCER_SHA}\" \
            hangover/native_observer_hook.c hangover/native_dispatch_semantic_hook.c \
            -o /opt/miel/native-observer-hook.dll
          $CC -m32 -std=c11 -Os -s -shared -Wl,--kill-at \
            x86_wine/native_observer_dinput_proxy.c -o /opt/miel/DINPUT.dll
          $CC -m32 -std=c11 -Os -s -Ihangover \
            fex_wine/win32_readiness_canary.c -o /opt/miel/wine-readiness-canary.exe -lole32
          echo "=== Build complete ==="

      - name: Download game files
        uses: actions/download-artifact@v4
        with:
          name: game-files
          retention-days: 1
          path: ${{ runner.temp }}

      - name: Setup game and run suite
        shell: bash
        run: |
          set -ex
          export REPOSITORY_ROOT="$(pwd)"
          export MIEL_NATIVE_BACKEND_ID=native
          export INPUT_KEEPER="${{ inputs.input_keeper }}"
          export DDRAW_RENDERER="${{ inputs.ddraw_renderer }}"
          export STRIP_AT_LANGUAGE="${{ inputs.strip_at_language }}"
          # Scheduler watchdog: emit manager_renders vs manager_ticks every
          # ~10s so we can tell "rendering but not ticking" (mode/score issue)
          # from "no frame activity at all" (init/dialog/detour corruption) —
          # the decisive split for why the manager tick never fires.
          export MIEL_OBSERVER_BOOTSTRAP_DIAGNOSTICS=1
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export ISO_GPG_PASSPHRASE="${{ secrets.ISO_GPG_PASSPHRASE }}"
          RUN_ROOT="$RUNNER_TEMP/miel-native"
          mkdir -p "$RUN_ROOT/game"
          cd "$RUN_ROOT/game"
          GAME_TAR=$(cygpath -u "$RUNNER_TEMP/game-files.tar.gz" 2>/dev/null || echo "$RUNNER_TEMP/game-files.tar.gz")
          tar xzf "$GAME_TAR"
          cd "$REPOSITORY_ROOT"
          
          # Download and mount ISO as virtual CD-ROM (game checks for CD presence)
          echo "=== Mounting ISO as CD-ROM ==="
          ISO_DIR2="$RUNNER_TEMP/miel-isos2"
          mkdir -p "$ISO_DIR2"
          gh release download flight-iso-v1 --repo meneerkrabs/miel-flight-x86             --pattern "Mielvliegt.iso.gpg" --dir "$ISO_DIR2" || true
          echo "$ISO_GPG_PASSPHRASE" | gpg --batch --yes --decrypt             --passphrase-fd 0 --output "$ISO_DIR2/Mielvliegt.iso" "$ISO_DIR2/Mielvliegt.iso.gpg" 2>/dev/null || true
          ISO_PATH=$(cygpath -w "$ISO_DIR2/Mielvliegt.iso" 2>/dev/null || echo "$ISO_DIR2/Mielvliegt.iso")
          echo "ISO at: $ISO_PATH"
          powershell.exe -Command "Mount-DiskImage -ImagePath '$ISO_PATH' -PassThru | Get-Volume | Select-Object -ExpandProperty DriveLetter" > /tmp/cd-drive.txt 2>&1 || true
          CD_DRIVE=$(cat /tmp/cd-drive.txt | tr -d '[:space:]')
          echo "CD drive: ${CD_DRIVE:-NOT_MOUNTED}"
          
          # Setup directories
          GAME_ROOT="$RUN_ROOT/game"
          PROXY_ROOT="$RUN_ROOT/proxy"
          FIXTURE_ROOT="$RUN_ROOT/fixture"
          SUITE_ROOT="$RUN_ROOT/suite"
          OUTPUT_ROOT="$RUN_ROOT/output"
          CLEAN_STATE_ROOT="$RUN_ROOT/game-clean"
          mkdir -p "$PROXY_ROOT" "$FIXTURE_ROOT" "$CLEAN_STATE_ROOT"
          
          TOOLS_SRC="/opt/miel"
          install -m 0600 "$GAME_ROOT/MulleMeck.exe" "$PROXY_ROOT/MulleMeck.exe"
          install -m 0600 "$TOOLS_SRC/DINPUT.dll" "$PROXY_ROOT/DINPUT.dll"
          install -m 0600 "$TOOLS_SRC/native-observer-hook.dll" "$PROXY_ROOT/native-observer-hook.dll"
          
          # Copy system32 dinput as real
          cp "C:/Windows/SysWOW64/dinput.dll" "$PROXY_ROOT/dinput-real.dll" 2>/dev/null || cp "C:/windows/system32/dinput.dll" "$PROXY_ROOT/dinput-real.dll" 2>/dev/null || true
          
          # Restore user fixture
          python3 -c "import base64,gzip,sys; from pathlib import Path; s,t=Path(sys.argv[1]),Path(sys.argv[2]); t.write_bytes(gzip.decompress(base64.b64decode(''.join(s.read_text().split()))))" "$REPOSITORY_ROOT/tools/miel_vliegt/fixtures/native_dispatch_driver/initial-user0.dat.gz.b64" "$FIXTURE_ROOT/user0.dat"
          mkdir -p "$GAME_ROOT/Data/User"
          install -m 0600 "$FIXTURE_ROOT/user0.dat" "$GAME_ROOT/Data/User/user0.dat"
          cp -a "$GAME_ROOT/." "$CLEAN_STATE_ROOT/"
          
          # Build SHA256 args
          declare -A input_paths=(
            [source_executable]="$GAME_ROOT/MulleMeck.exe"
            [disposable_target]="$PROXY_ROOT/MulleMeck.exe"
            [user_profile]="$FIXTURE_ROOT/user0.dat"
            [observer_dll]="$PROXY_ROOT/native-observer-hook.dll"
            [observer_launcher]="$TOOLS_SRC/native-observer-launcher.exe"
            [proxy_dinput]="$PROXY_ROOT/DINPUT.dll"
            [real_dinput]="$PROXY_ROOT/dinput-real.dll"
            [smoke_executable]="$TOOLS_SRC/wine-readiness-canary.exe"
            [data_archive]="$GAME_ROOT/data.up"
            [map_archive]="$GAME_ROOT/map.up"
            [sounds_archive]="$GAME_ROOT/sounds.up"
            [miel_ini]="$GAME_ROOT/Miel.ini"
          )
          sha256_args=()
          for label in $(printf '%s\n' "${!input_paths[@]}" | sort); do
            sha="$(sha256sum "${input_paths[$label]}" | cut -d' ' -f1 | tr -d \\)"
            sha256_args+=("--${label//_/-}-sha256" "$sha")
          done
          
          # Note: GH_TOKEN and ISO_GPG_PASSPHRASE needed for ISO download above
          # Background input keeper: send periodic spacebar to keep game alive
          # Install DirectX 9.0c End-User Runtime (provides DX7/DX8/DX9 compat layers)
          echo "=== Installing DirectX 9.0c Runtime ==="
          # Download from Microsoft
          curl -sL "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28FFF4A427/dxsetup.exe" -o /tmp/redist.exe 2>/dev/null || true
          if [ -f /tmp/redist.exe ] && [ -s /tmp/redist.exe ]; then
            /tmp/redist.exe /silent 2>/dev/null || true
            echo "DirectX 9.0c runtime installed"
          else
            echo "Download failed, trying CD version"
            if [ -f "E:/dxsetup.exe" ]; then
              cmd.exe /c "E:\\dxsetup.exe /silent" 2>/dev/null || true
              echo "CD DirectX setup completed"
            fi
          fi
          
          # Copy ALL game files to proxy directory (game runs from there and needs its DLLs)
          echo "=== Copying game files to proxy dir ==="
          cp -a "$GAME_ROOT/." "$PROXY_ROOT/"
          # Re-install our proxy DLLs over the game's originals
          install -m 0600 "$TOOLS_SRC/DINPUT.dll" "$PROXY_ROOT/DINPUT.dll"
          install -m 0600 "$TOOLS_SRC/native-observer-hook.dll" "$PROXY_ROOT/native-observer-hook.dll"
          install -m 0600 "$PROXY_ROOT/dinput-real.dll" "$PROXY_ROOT/dinput-real.dll" 2>/dev/null || true
          echo "Game files in proxy dir: $(ls "$PROXY_ROOT/" | wc -l) items"
          
          # Install cnc-ddraw: DirectDraw wrapper for old DX1-7 games on Win10/11
          echo "=== Installing cnc-ddraw DirectDraw wrapper ==="
          curl -sL "https://github.com/FunkyFr3sh/cnc-ddraw/releases/download/v7.1.0.0/cnc-ddraw.zip" -o /tmp/cnc-ddraw.zip 2>/dev/null
          if [ -f /tmp/cnc-ddraw.zip ] && [ -s /tmp/cnc-ddraw.zip ]; then
            mkdir -p /tmp/cnc-ddraw-extract
            cd /tmp/cnc-ddraw-extract && 7z x /tmp/cnc-ddraw.zip >/dev/null 2>&1 || true
            # Copy ddraw.dll to game and proxy directories
            cp /tmp/cnc-ddraw-extract/ddraw.dll "$PROXY_ROOT/ddraw.dll" 2>/dev/null || true
            cp /tmp/cnc-ddraw-extract/ddraw.dll "$GAME_ROOT/ddraw.dll" 2>/dev/null || true
            # Copy config
            cp /tmp/cnc-ddraw-extract/ddraw.ini "$PROXY_ROOT/ddraw.ini" 2>/dev/null || true
            # Configure cnc-ddraw for software rendering + windowed mode
            printf '[ddraw]\nfullscreen=false\nwindowed=true\nmaintas=false\nboxing=false\nmaxfps=60\nvsync=false\nhardwareaccel=false\nrenderer=%s\n' "${DDRAW_RENDERER:-gdi}" > "$PROXY_ROOT/ddraw.ini"
            cp "$PROXY_ROOT/ddraw.ini" "$GAME_ROOT/ddraw.ini" 2>/dev/null || true
            echo "cnc-ddraw installed (v7.1.0.0)"
            ls -la "$PROXY_ROOT/ddraw.dll" 2>/dev/null || echo "ddraw.dll NOT found"
          else
            echo "cnc-ddraw download failed, trying alternative DX wrappers"
            # Try Wine's ddraw from MSYS2
            cp "C:/Windows/SysWOW64/ddraw.dll" "$PROXY_ROOT/ddraw.dll" 2>/dev/null || true
          fi
          cd "$REPOSITORY_ROOT"
          
          # Write config.ini to proxy directory (game reads from cwd)
          printf 'cleanup false\nsetupwindow false\ngtdriver gtSoftware\nmousesensitivity 1.0000\ntimescale 1.0000\nmainlog false\nfullscreen false\nstreammap false\nuserid 0\nusername unknown\n' > "$PROXY_ROOT/config.ini"
          echo "Wrote config.ini to proxy dir (streammap=false)"

          # Test the @language hypothesis: the shipped packages.ini ends with
          # an unresolved "@language" placeholder. The voices live in
          # sounds.up (already mounted), so strip the placeholder and see if
          # the mode_fly voice load stops returning NULL.
          if [ "${STRIP_AT_LANGUAGE:-false}" = "true" ]; then
            printf 'map.up\ndata.up\nsounds.up\n' | tee \
              "$PROXY_ROOT/packages.ini" "$GAME_ROOT/packages.ini" >/dev/null
            echo "=== packages.ini rewritten without @language ==="
            cat "$PROXY_ROOT/packages.ini"
          fi
          cat "$RUN_ROOT/direct-test/observer.log" 2>/dev/null | tail -30 || echo "No observer log"
          echo "=== stderr ==="
          cat "$RUN_ROOT/direct-test/stderr.log" 2>/dev/null | tail -20 || echo "No stderr"
          cd "$REPOSITORY_ROOT"
          
          # Install dgVoodoo2: DX1-8 → DX11 wrapper (makes old games work on Win10/11)
          echo "=== Installing dgVoodoo2 DX wrapper ==="
          curl -sL "https://github.com/dege-dosx/dgVoodoo2/releases/download/v2.82/dgVoodoo2_82.zip" -o /tmp/dgvoodoo.zip 2>/dev/null
          if [ -f /tmp/dgvoodoo.zip ] && [ -s /tmp/dgvoodoo.zip ]; then
            mkdir -p /tmp/dgvoodoo
            cd /tmp/dgvoodoo && 7z x /tmp/dgvoodoo.zip >/dev/null 2>&1 || true
            # Copy the DX wrapper DLLs to the game proxy directory
            cp /tmp/dgvoodoo/MS/x86/DDraw.dll "$PROXY_ROOT/DDraw.dll" 2>/dev/null || true
            cp /tmp/dgvoodoo/MS/x86/D3DImm.dll "$PROXY_ROOT/D3DImm.dll" 2>/dev/null || true
            cp /tmp/dgvoodoo/MS/x86/D3D8.dll "$PROXY_ROOT/D3D8.dll" 2>/dev/null || true
            cp /tmp/dgvoodoo/MS/x86/D3D9.dll "$PROXY_ROOT/D3D9.dll" 2>/dev/null || true
            cp /tmp/dgvoodoo/MS/x86/DInput.dll "$PROXY_ROOT/DInput8.dll" 2>/dev/null || true
            # Copy dgVoodoo config (force software rendering, disable watermark)
            cp /tmp/dgvoodoo/dgVoodoo.conf "$PROXY_ROOT/dgVoodoo.conf" 2>/dev/null || true
            # Modify config for software rendering
            sed -i 's/ScalingMode =.*/ScalingMode = unspecified/' "$PROXY_ROOT/dgVoodoo.conf" 2>/dev/null || true
            echo "dgVoodoo2 installed"
            ls "$PROXY_ROOT/"*.dll | head -10
          else
            echo "dgVoodoo2 download failed"
          fi
          cd "$REPOSITORY_ROOT"
          
          # Add DirectX registry keys (Wine creates these, old games check them)
          echo "=== DirectX registry setup ==="
          powershell.exe -NoProfile -Command "
            # DirectX version key
            New-Item -Path 'HKLM:\SOFTWARE\Microsoft\DirectX' -Force | Out-Null
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\DirectX' -Name 'Version' -Value '4.07.00.0700' -Type String
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\DirectX' -Name 'InstalledVersion' -Value '4.07.00.0700' -Type String
            # DirectX 7 Media Foundation
            New-Item -Path 'HKLM:\SOFTWARE\Microsoft\DirectX\DirectX7' -Force | Out-Null
            Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\DirectX\DirectX7' -Name 'Installed' -Value 1 -Type DWord
            # Media Foundation
            New-Item -Path 'HKLM:\SOFTWARE\Microsoft\DirectX\Media Foundation' -Force | Out-Null
            Write-Host 'DirectX registry keys added'
          " 2>/dev/null || true

          if [ "${INPUT_KEEPER:-false}" = "true" ]; then
            echo "=== Starting background input keeper ==="
            powershell.exe -NoProfile -WindowStyle Hidden -Command "while(\$true){[System.Windows.Forms.SendKeys]::SendWait(' ');Start-Sleep -Milliseconds 300}" &
            KEEPER_PID=$!
            echo "Input keeper PID: $KEEPER_PID"
          else
            echo "=== Input keeper DISABLED (isolating self-exit cause) ==="
          fi
          
          echo "=== Running suite (native Windows) ==="
          python3 tools/miel_vliegt/native_semantic_suite.py \
            --prefix-mode cold-audit \
            --expected-uid "$(id -u)" \
            --backend-id native \
            --backend-hodll windows \
            --container-image native \
            --container-image-sha256 native \
            --container-id native \
            --container-mount-root "$RUN_ROOT" \
            --source-executable "${input_paths[source_executable]}" \
            --disposable-target "${input_paths[disposable_target]}" \
            --game-root "$GAME_ROOT" \
            --state-root "$GAME_ROOT" \
            --clean-state-root "$CLEAN_STATE_ROOT" \
            --user-profile "${input_paths[user_profile]}" \
            --observer-dll "${input_paths[observer_dll]}" \
            --observer-launcher "${input_paths[observer_launcher]}" \
            --proxy-dinput "${input_paths[proxy_dinput]}" \
            --real-dinput "${input_paths[real_dinput]}" \
            --smoke-executable "${input_paths[smoke_executable]}" \
            --suite-root "$SUITE_ROOT" \
            --wine-prefix "$RUN_ROOT/wine-prefix" \
            --output-root "$OUTPUT_ROOT" \
            --observe-ms 3600000 \
            --max-records 1000000 \
            "${sha256_args[@]}" || true

          # Preserve staging directory logs for debugging
          find "$OUTPUT_ROOT" -name "*.log" -exec cp {} "$OUTPUT_ROOT/" 2>/dev/null || true
          find "$OUTPUT_ROOT/.cold-capture-staging" -type f -name "*.log" -exec cp {} "$OUTPUT_ROOT/preserved-{}.log" 2>/dev/null || true

          # Collect the DINPUT proxy debug log (self-exit caller breadcrumbs)
          # from wherever the game ran, into the uploaded output root.
          find "$RUN_ROOT" -name "proxy-debug.log" -exec sh -c \
            'cp "$1" "$0/proxy-debug-$(echo "$1" | tr "/\\\\" "__").log"' \
            "$OUTPUT_ROOT" {} \; 2>/dev/null || true
          echo "=== proxy-debug.log copies ==="
          ls -la "$OUTPUT_ROOT"/proxy-debug-*.log 2>/dev/null || echo "none found"

          # Stop background input keeper (only started when enabled)
          if [ -n "${KEEPER_PID:-}" ]; then
            kill $KEEPER_PID 2>/dev/null || true
            echo "=== Background input keeper stopped ==="
          fi

      # Small logs-only artifact: the full results artifact is hundreds of MB
      # (three game-file copies) and is slow/fragile to download. The crash
      # breadcrumbs live in a handful of small logs — collect just those.
      - name: Collect logs only
        if: always()
        shell: bash
        run: |
          DEST="$RUNNER_TEMP/flight-logs"
          mkdir -p "$DEST"
          find "$RUNNER_TEMP/miel-native" \
            \( -name "proxy-debug*.log" -o -name "gtSoftware*.log" \
               -o -name "*observer*.log" -o -name "stderr*.log" \
               -o -name "*.json" \) \
            -exec sh -c 'cp "$1" "$0/$(echo "$1" | tr "/\\\\" "__")"' \
            "$DEST" {} \; 2>/dev/null || true

          # Project the compact manager-tick-vs-render diagnostic out of each
          # big result receipt into small summary files, so the takeoff-climb
          # crash (early_phase_watchdog, phase_timestamps, record_count,
          # session_state) is diagnosable from the small flight-logs artifact
          # without the 100s-MB results artifact.
          python3 - "$DEST" "$RUNNER_TEMP/miel-native/output" <<'PY'
          import json, pathlib, sys
          dest, out_root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          written = 0
          for path in sorted(out_root.rglob("*.json")) if out_root.exists() else []:
              try:
                  data = json.loads(path.read_text(encoding="utf-8", errors="replace"))
              except (json.JSONDecodeError, OSError):
                  continue
              if not isinstance(data, dict):
                  continue
              nav = data.get("navigation") or {}
              trace = data.get("observer_trace") or {}
              obs_log = data.get("observer_log") or {}
              summary = {
                  "source": str(path.relative_to(out_root)),
                  "id": data.get("id") or data.get("scenario"),
                  "status": data.get("status"),
                  "observer_trace": {
                      "record_count": (
                          trace.get("record_count") or obs_log.get("record_count")
                      ),
                  },
                  "navigation": {
                      "early_phase_watchdog": (
                          nav.get("early_phase_watchdog")
                          or data.get("early_phase_watchdog")
                      ),
                      "phase_timestamps": (
                          nav.get("phase_timestamps") or data.get("phase_timestamps")
                      ),
                  },
                  "session_state": data.get("session_state"),
              }
              tail = data.get("observer_tail")
              if isinstance(tail, list) and summary["session_state"] is None:
                  for line in reversed(tail):
                      if isinstance(line, str) and "session_state" in line:
                          try:
                              parsed = json.loads(line)
                              if isinstance(parsed, dict) and "session_state" in parsed:
                                  summary["session_state"] = parsed["session_state"]
                                  break
                          except (json.JSONDecodeError, ValueError):
                              pass
              if any(v is not None for v in (
                  summary["observer_trace"]["record_count"],
                  summary["navigation"]["early_phase_watchdog"],
                  summary["navigation"]["phase_timestamps"],
                  summary["session_state"],
              )):
                  rel = str(path.relative_to(out_root).with_suffix(""))
                  safe = rel.replace("/", "_").replace("\\", "_")
                  (dest / f"receipt-summary-{safe}.json").write_text(
                      json.dumps(summary, indent=2, default=str) + "\n",
                      encoding="utf-8",
                  )
                  written += 1
          print(f"Wrote {written} receipt-summary files to {dest}")
          PY

          ls -la "$DEST" | head -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-logs
          retention-days: 3
          path: ${{ runner.temp }}/flight-logs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-windows-results
          retention-days: 1
          path: ${{ runner.temp }}/miel-native/
