name: Native Flight Windows extraction readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-in-one-job:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Probe private game extraction without an artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISO_GPG_PASSPHRASE: ${{ secrets.ISO_GPG_PASSPHRASE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $stage = 'setup'
          $gpgExitCode = $null
          $gpgErrorCategory = 'NONE'
          $private = Join-Path $env:RUNNER_TEMP 'miel-flight-private'
          $process = $null
          $iso = $null
          $mountAttempted = $false
          $cdMounted = $false
          $alive = $false
          $windowPresent = $false
          $nativeExitCode = $null
          $probeResult = $null
          $probeSha256 = $null
          $cleanupFailed = $false
          $finalResult = $null
          try {
            New-Item -ItemType Directory -Path $private -Force | Out-Null
            $stage = 'tools'
            $gpg = @('C:\msys64\usr\bin\gpg.exe', 'C:\Program Files\Git\usr\bin\gpg.exe') |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $gpg -or -not $env:ISO_GPG_PASSPHRASE -or -not (Get-Command 7z -ErrorAction SilentlyContinue)) {
              throw 'required tool or existing secret unavailable'
            }
            $stage = 'download'
            & gh release download flight-iso-v1 --repo meneerkrabs/miel-flight-x86 `
              --pattern 'Mielvliegt.iso.gpg' --dir $private --clobber *> (Join-Path $private 'download.log')
            if ($LASTEXITCODE -ne 0) { throw 'release download failed' }
            $encrypted = Join-Path $private 'Mielvliegt.iso.gpg'
            if (-not (Test-Path $encrypted)) { throw 'downloaded ISO absent' }
            $stage = 'decrypt'
            $iso = Join-Path $private 'Mielvliegt.iso'
            $gpgHomeWindows = Join-Path $private 'gpg-home'
            New-Item -ItemType Directory -Path $gpgHomeWindows -Force | Out-Null
            $passFile = Join-Path $private 'gpg-passphrase.txt'
            [System.IO.File]::WriteAllText($passFile, $env:ISO_GPG_PASSPHRASE,
              [System.Text.UTF8Encoding]::new($false))
            $gpgInput = $encrypted
            $gpgOutput = $iso
            $gpgPassFile = $passFile
            $gpgHome = $gpgHomeWindows
            if ($gpg.StartsWith('C:\msys64\', [StringComparison]::OrdinalIgnoreCase)) {
              $stage = 'path-conversion'
              $cygpath = Join-Path (Split-Path $gpg) 'cygpath.exe'
              if (-not (Test-Path $cygpath)) { throw 'MSYS2 path helper absent' }
              $gpgInput = (& $cygpath -u $encrypted 2> (Join-Path $private 'cygpath.log')).Trim()
              $gpgOutput = (& $cygpath -u $iso 2>> (Join-Path $private 'cygpath.log')).Trim()
              $gpgPassFile = (& $cygpath -u $passFile 2>> (Join-Path $private 'cygpath.log')).Trim()
              $gpgHome = (& $cygpath -u $gpgHomeWindows 2>> (Join-Path $private 'cygpath.log')).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $gpgInput -or -not $gpgOutput -or -not $gpgPassFile -or -not $gpgHome) {
                throw 'MSYS2 path conversion failed'
              }
              $stage = 'decrypt'
            }
            $env:PATH = (Split-Path $gpg) + ';' + $env:PATH
            & $gpg --homedir $gpgHome --batch --yes --quiet --no-tty --pinentry-mode loopback `
              --passphrase-file $gpgPassFile --output $gpgOutput --decrypt $gpgInput `
              2> (Join-Path $private 'gpg.log')
            $gpgExitCode = $LASTEXITCODE
            $stage = 'credential-cleanup'
            Remove-Item $passFile -Force -ErrorAction Stop
            $stage = 'decrypt'
            if ($gpgExitCode -ne 0) {
              $gpgMessage = Get-Content (Join-Path $private 'gpg.log') -Raw -ErrorAction SilentlyContinue
              if ($gpgMessage -match 'bad passphrase|bad session key|decryption failed: Bad key') {
                $gpgErrorCategory = 'CREDENTIAL_REJECTED'
              } elseif ($gpgMessage -match 'pinentry|dev/tty|Inappropriate ioctl') {
                $gpgErrorCategory = 'TTY_OR_AGENT'
              } elseif ($gpgMessage -match 'gpg-passphrase.txt') {
                $gpgErrorCategory = 'PASSPHRASE_FILE'
              } elseif ($gpgMessage -match 'Mielvliegt.iso.gpg') {
                $gpgErrorCategory = 'ENCRYPTED_INPUT'
              } elseif ($gpgMessage -match 'Mielvliegt.iso') {
                $gpgErrorCategory = 'DECRYPTED_OUTPUT'
              } elseif ($gpgMessage -match 'homedir|keyring|pubring|socket') {
                $gpgErrorCategory = 'GPG_HOME'
              } elseif ($gpgMessage -match 'No such file|can.t open') {
                $gpgErrorCategory = 'PATH_OR_INPUT'
              } elseif ($gpgMessage -match 'No valid OpenPGP data|invalid packet|bad armor') {
                $gpgErrorCategory = 'ENCRYPTED_DATA'
              } else {
                $gpgErrorCategory = 'OTHER'
              }
              throw 'decryption failed'
            }
            $stage = 'credential-cleanup'
            Remove-Item Env:GH_TOKEN, Env:ISO_GPG_PASSPHRASE -ErrorAction Stop
            if ($env:GH_TOKEN -or $env:ISO_GPG_PASSPHRASE) {
              throw 'credential environment remains'
            }
            $stage = 'observer-build'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw 'Visual Studio locator unavailable' }
            $vsroot = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath |
              Select-Object -First 1)
            if (-not $vsroot) { throw 'x86 compiler unavailable' }
            $vcvars = Join-Path $vsroot 'VC\Auxiliary\Build\vcvarsall.bat'
            if (-not (Test-Path $vcvars)) { throw 'x86 compiler setup unavailable' }
            $probeSource = (Resolve-Path 'tools/miel_vliegt/windows_native_probe/native_probe.c').Path
            $probeExe = Join-Path $private 'native-probe.exe'
            $buildCmd = Join-Path $private 'build-probe.cmd'
            @(
              '@echo off'
              ('call "{0}" x86 >nul' -f $vcvars)
              'if errorlevel 1 exit /b 1'
              ('cl /nologo /W4 /O2 /TC "{1}" /link /OUT:"{0}" advapi32.lib gdi32.lib user32.lib' -f $probeExe, $probeSource)
              'exit /b %errorlevel%'
            ) | Set-Content -Path $buildCmd -Encoding Ascii
            & $env:ComSpec /d /c $buildCmd *> (Join-Path $private 'build-probe.log')
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $probeExe)) {
              throw 'native x86 probe build failed'
            }
            $probeSha256 = (Get-FileHash $probeExe -Algorithm SHA256).Hash.ToLowerInvariant()
            $stage = 'identity'
            $identity = Get-Content 'content/miel_vliegt/source_identity.json' -Raw | ConvertFrom-Json
            if ((Get-FileHash $iso -Algorithm SHA256).Hash.ToLowerInvariant() -ne $identity.iso.sha256) {
              throw 'ISO identity differs'
            }
            $stage = 'iso-extract'
            $installer = Join-Path $private 'installer'
            & 7z x -y "-o$installer" $iso *> (Join-Path $private 'iso-extract.log')
            if ($LASTEXITCODE -ne 0) { throw 'ISO extraction failed' }
            $cab = Get-ChildItem $installer -File -Recurse -Filter 'data1.cab' |
              Select-Object -First 1
            if (-not $cab) { throw 'installer CAB missing' }
            $stage = 'unshield-tool'
            $unshieldArchive = Join-Path $private 'unshield.7z'
            Invoke-WebRequest `
              'https://raw.githubusercontent.com/ScoopInstaller/Binary/master/unshield/unshield-1.6.2-x64.7z' `
              -OutFile $unshieldArchive | Out-Null
            if ((Get-FileHash $unshieldArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              '662fefefc6988a3744ddc6b5b8d2e96ac21876d532f7d23a597c4ca797764a6b') {
              throw 'pinned unshield identity differs'
            }
            $unshieldRoot = Join-Path $private 'unshield'
            & 7z x -y "-o$unshieldRoot" $unshieldArchive *> (Join-Path $private 'unshield-extract.log')
            if ($LASTEXITCODE -ne 0) { throw 'unshield tool extraction failed' }
            $unshield = Join-Path $unshieldRoot 'unshield.exe'
            if (-not (Test-Path $unshield)) { throw 'unshield tool unavailable' }
            $stage = 'cab-extract'
            $system = Join-Path $private 'system'
            & $unshield -g 'System Files' -d $system x $cab.FullName `
              *> (Join-Path $private 'cab-extract.log')
            if ($LASTEXITCODE -ne 0) { throw 'InstallShield CAB extraction failed' }
            $game = Get-ChildItem $system -File -Recurse -Filter 'MulleMeck.exe' |
              Select-Object -First 1
            if (-not $game -or (Get-FileHash $game.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $identity.executable.sha256) {
              throw 'original executable identity unavailable'
            }
            $stage = 'game-inputs'
            $gameDir = Split-Path $game.FullName
            & 7z e -y "-o$gameDir" $iso data.up map.up sounds.up Miel.ini `
              *> (Join-Path $private 'game-inputs.log')
            if ($LASTEXITCODE -ne 0) { throw 'original game inputs unavailable' }
            foreach ($name in @('data.up', 'map.up', 'sounds.up', 'Miel.ini')) {
              if (-not (Test-Path (Join-Path $gameDir $name))) { throw 'game input missing' }
            }
            $stage = 'native-startup'
            $mountAttempted = $true
            try {
              Mount-DiskImage -ImagePath $iso -PassThru -ErrorAction Stop | Out-Null
              $cdMounted = $true
            } catch {
              $cdMounted = $false
            }
            if (-not $cdMounted) { $stage = 'cd-mount'; throw 'ISO mount unavailable' }
            $stage = 'native-observation'
            $probeLog = Join-Path $private 'native-probe.json'
            & $probeExe $game.FullName $probeLog 60 --select-hardware `
              *> (Join-Path $private 'native-probe-stdout.log')
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $probeLog)) {
              throw 'native observer failed'
            }
            $probeResult = Get-Content $probeLog -Raw | ConvertFrom-Json
            if ($probeResult.schema -ne 'native-flight-probe-v1' -or
                $probeResult.exe_sha256 -ne $identity.executable.sha256) {
              throw 'native observer identity differs'
            }
            $alive = [bool]$probeResult.process_alive_after_15s
            $windowPresent = [bool]$probeResult.window_present
            $nativeExitCode = $probeResult.child_exit_code
            if (-not $alive -or -not $windowPresent -or
                -not $probeResult.hardware_selection_sent -or
                -not $probeResult.hardware_dialog_closed -or
                -not $probeResult.create_callsite_verified -or
                -not $probeResult.manager_slots_verified -or
                -not $probeResult.create_success -or
                -not $probeResult.device_nonnull -or
                $probeResult.manager_ticks -lt 2 -or
                $probeResult.manager_renders -lt 2 -or
                $probeResult.pixel_samples -lt 2 -or
                $probeResult.pixel_changes -lt 1 -or
                $probeResult.nonblack_pixels_max -lt 1 -or
                $probeResult.captured_width -lt 1 -or
                $probeResult.captured_height -lt 1) {
              throw 'original renderer progress not demonstrated'
            }
            $finalResult = @{status='NATIVE_RENDER_DIAGNOSTIC_ONLY';
              iso_sha256_matched=$true; executable_sha256_matched=$true;
              cd_mounted=$cdMounted; process_alive_after_15s=$alive;
              window_present=$windowPresent; create_hr=$probeResult.create_hr;
              create_success=$probeResult.create_success;
              device_nonnull=$probeResult.device_nonnull;
              manager_ticks=$probeResult.manager_ticks;
              manager_renders=$probeResult.manager_renders;
              pixel_samples=$probeResult.pixel_samples;
              pixel_changes=$probeResult.pixel_changes;
              nonblack_pixels_max=$probeResult.nonblack_pixels_max;
              captured_width=$probeResult.captured_width;
              captured_height=$probeResult.captured_height;
              window_class=$probeResult.window_class;
              dialog_reason=$probeResult.dialog_reason;
              window_title_safe=$probeResult.window_title_safe;
              button_labels_safe=$probeResult.button_labels_safe;
              hardware_selection_guard=$probeResult.hardware_selection_guard;
              hardware_selection_sent=$probeResult.hardware_selection_sent;
              process_cpu_ms=$probeResult.process_cpu_ms;
              probe_sha256=$probeSha256; artifact_count=0}
          } catch {
            $finalResult = @{status='FAIL'; stage=$stage; artifact_count=0}
            if ($stage -eq 'native-observation') {
              $finalResult.cd_mounted = $cdMounted
              $finalResult.process_alive_after_15s = $alive
              $finalResult.window_present = $windowPresent
              $finalResult.process_exit_code = $nativeExitCode
              $finalResult.probe_sha256 = $probeSha256
              if ($probeResult) {
                foreach ($key in @('gt_loaded', 'create_callsite_verified',
                    'manager_slots_verified',
                    'create_calls', 'create_returns', 'create_success',
                    'create_hr', 'device_nonnull', 'manager_ticks',
                    'manager_renders', 'pixel_samples', 'pixel_changes',
                    'nonblack_pixels_max', 'captured_width', 'captured_height',
                    'window_class', 'dialog_reason', 'window_title_safe',
                    'button_labels_safe', 'child_static_count',
                    'child_button_count', 'child_edit_count', 'process_cpu_ms',
                    'hardware_selection_requested', 'hardware_selection_attempted',
                    'hardware_selection_sent', 'hardware_dialog_closed',
                    'hardware_selection_guard')) {
                  $finalResult[$key] = $probeResult.$key
                }
              }
            }
            if ($stage -eq 'decrypt') {
              $finalResult.gpg_exit_code = $gpgExitCode
              $finalResult.gpg_error_category = $gpgErrorCategory
            }
          } finally {
            if ($process) {
              try {
                $process.Refresh()
                if (-not $process.HasExited) {
                  try { $process.Kill() }
                  catch {
                    $process.Refresh()
                    if (-not $process.HasExited) { throw }
                  }
                  if (-not $process.WaitForExit(5000)) { $cleanupFailed = $true }
                }
              } catch { $cleanupFailed = $true }
            }
            if ($mountAttempted -and $iso) {
              try {
                $image = Get-DiskImage -ImagePath $iso -ErrorAction Stop
                if ($image.Attached) {
                  Dismount-DiskImage -ImagePath $iso -ErrorAction Stop | Out-Null
                }
              } catch { $cleanupFailed = $true }
            }
            try {
              if (Test-Path $private) {
                Remove-Item $private -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path $private) { $cleanupFailed = $true }
            } catch { $cleanupFailed = $true }
          }
          if ($cleanupFailed) {
            $finalResult = @{status='FAIL'; stage='cleanup'; artifact_count=0}
          }
          $finalResult | ConvertTo-Json -Compress | Write-Output
          if ($finalResult.status -eq 'FAIL') { exit 1 }
