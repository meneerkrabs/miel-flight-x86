name: Native flight x86 suite (no FEX, no Docker)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ISO_RELEASE_TAG: flight-iso-v1

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WineHQ and build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-staging
          sudo apt-get install -y libgl1-mesa-dri libgl1-mesa-dri:i386 libgl1 libgl1:i386 \
            fonts-liberation xauth xvfb p7zip-full unshield \
            gcc-mingw-w64-i686
          wine --version

      - name: Build observer tools
        run: |
          set -ex
          cd tools/miel_vliegt
          python3 native_scene_navigator.py emit-header hangover/native_scenes.generated.h 2>/dev/null || true
          PRODUCER_SHA=$(python3 -c "from native_dispatch_hook_contract import compute_producer_build_sha; print(compute_producer_build_sha())" 2>/dev/null || echo "placeholder")
          EXE_HASH="a84550b46612dc326177a67a84d6fd1e35aae3dc74361254611d1b03eda559a2"
          mkdir -p /opt/miel
          i686-w64-mingw32-gcc -std=c11 -Os -s -Ihangover \
            -DMIEL_EXPECTED_EXE_SHA256=\"$EXE_HASH\" \
            hangover/native_observer_launcher.c -o /opt/miel/native-observer-launcher.exe
          i686-w64-mingw32-gcc -std=c11 -Os -s -shared -Ihangover \
            -DMVDS_PRODUCER_BUILD_SHA256=\"${PRODUCER_SHA}\" \
            hangover/native_observer_hook.c hangover/native_dispatch_semantic_hook.c \
            -o /opt/miel/native-observer-hook.dll
          i686-w64-mingw32-gcc -std=c11 -Os -s -shared -Wl,--kill-at \
            x86_wine/native_observer_dinput_proxy.c -o /opt/miel/DINPUT.dll
          i686-w64-mingw32-gcc -std=c11 -Os -s -Ihangover \
            fex_wine/win32_readiness_canary.c -lole32 -o /opt/miel/wine-readiness-canary.exe
          cp /usr/lib/i386-linux-gnu/wine/i386-windows/dinput.dll /opt/miel/dinput-real.dll
          echo "=== Build complete ==="

      - name: Download and decrypt ISO
        run: |
          ISO_DIR="$RUNNER_TEMP/miel-isos"
          mkdir -p "$ISO_DIR"
          gh release download flight-iso-v1 --repo meneerkrabs/miel-flight-x86 \
            --pattern "Mielvliegt.iso.gpg" --dir "$ISO_DIR"
          echo "$ISO_GPG_PASSPHRASE" | gpg --batch --yes --decrypt \
            --passphrase-fd 0 --output "$ISO_DIR/Mielvliegt.iso" "$ISO_DIR/Mielvliegt.iso.gpg"
          rm "$ISO_DIR/Mielvliegt.iso.gpg"
          echo "PRIVATE_ISO=$ISO_DIR/Mielvliegt.iso" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISO_GPG_PASSPHRASE: ${{ secrets.ISO_GPG_PASSPHRASE }}

      - name: Run suite (native x86 Wine, no FEX, no Docker)
        run: |
          export REPOSITORY_ROOT="$(pwd)"
          export MIEL_NATIVE_BACKEND_ID=wine
          NATIVE_RUN_ROOT="$RUNNER_TEMP/miel-native"
          deployment/run-x86-wine-suite.sh \
            --run-root "$NATIVE_RUN_ROOT" \
            --private-iso "$PRIVATE_ISO"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flight-x86-results
          path: ${{ runner.temp }}/miel-native/
